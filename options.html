<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini MCQ Solver - Extension Options</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }
    h1 { font-size: 18px; font-weight: 700; }
    p.desc { font-size: 13px; color: #64748b; margin-top: 2px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-save {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-save:hover { background: #4338ca; }
    .toast {
      display: none;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">G</div>
      <div>
        <h1>Gemini MCQ Solver Settings</h1>
        <p class="desc">Configure Gemini API key, model, and automation timings</p>
      </div>
    </div>

    <form id="optionsForm">
      <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
        <p class="hint">Obtain from Google AI Studio. Stored securely in your browser's extension storage.</p>
      </div>

      <div class="form-group">
        <label for="model">Gemini Model</label>
        <select id="model">
          <option value="gemini-3.7-flash">gemini-3.7-flash (Recommended, Fastest)</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro (Deep reasoning)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="apiEndpoint">Custom Backend Proxy URL (Optional)</label>
        <input type="text" id="apiEndpoint" placeholder="https://your-domain.com/api/gemini/solve">
        <p class="hint">Leave blank to call Google Gemini API directly from the background service worker.</p>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="clickDelayMs">Click Delay (ms)</label>
          <input type="number" id="clickDelayMs" min="200" max="3000" step="50" value="600">
        </div>
        <div class="form-group">
          <label for="scrollDelayMs">Scroll Step Delay (ms)</label>
          <input type="number" id="scrollDelayMs" min="300" max="4000" step="50" value="900">
        </div>
      </div>

      <button type="submit" class="btn-save">Save Settings</button>
      <div id="toast" class="toast">✓ Settings saved successfully!</div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
